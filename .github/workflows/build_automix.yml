name: Build Automix APK

on:
  workflow_dispatch:
  push:
    branches: ["feat/automix"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore signing keystore
        id: keystore_cache
        uses: actions/cache/restore@v4
        with:
          path: automix-release.keystore
          key: automix-release-keystore-v1

      - name: Create signing keystore if missing
        if: steps.keystore_cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore automix-release.keystore \
            -storepass automixpass \
            -alias automix \
            -keypass automixpass \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Metrolist Automix,O=Personal,C=VN"

      - name: Save signing keystore
        if: steps.keystore_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: automix-release.keystore
          key: automix-release-keystore-v1

      - name: Build FOSS Release APK
        shell: bash
        run: ./gradlew --console=plain :app:assembleFossRelease -x lint -x lintVitalFossRelease --warning-mode summary 2>&1 | tee build.log
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music.automix
          METROLIST_APP_NAME: Metrolist Automix

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          MSG=$(grep -n -E "^e: |error:|FAILED|What went wrong|Execution failed|Caused by|> " build.log | tail -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build log::$MSG"

      - name: Sign APK
        run: |
          UNSIGNED=$(find app/build/outputs/apk -name "*release*.apk" | head -n 1)
          echo "Unsigned APK: $UNSIGNED"
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          mkdir -p signed
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks automix-release.keystore \
            --ks-pass pass:automixpass \
            --key-pass pass:automixpass \
            --ks-key-alias automix \
            --out signed/metrolist-automix.apk \
            "$UNSIGNED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-automix-apk
          path: signed/metrolist-automix.apk
